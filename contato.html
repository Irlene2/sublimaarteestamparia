        href="img/logo1.png"
        type="image/x-icon"
    >

                    >

                </li>

            </ul>

        </nav>

    </header>


    <main>
    <section>
            <h1>Sublima Arte</h1>
            <p>Sua marca começa aqui.</p>
        </section>


    
        <section class="contato-container">


        
            <div class="localizacao">


                <div class="cabecalho-contato">

                
                    <h2>
                        Nossa localização
                    </h2>

                </div>


                <div class="mapa-container">

                    <iframe

                        class="mapa"

                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2906.942193451484!2d-43.42050632574594!3d-22.803338634180033!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9966b25ae1678b%3A0x8720956127e31b6!2sR.%20Osvaldo%20Cruz%2C%2052%20-%20Centro%2C%20Nil%C3%B3polis%20-%20RJ%2C%2026530-100!5e1!3m2!1spt-BR!2sbr!4v1784492094266!5m2!1spt-BR!2sbr"

                        title="Localização da Sublima Arte"

                        allowfullscreen

                        loading="lazy"

                        referrerpolicy="strict-origin-when-cross-origin">

                    </iframe>

                </div>


                

            </div>


            <aside class="sidebar">


                <div class="cabecalho-contato">

                
                    <h2>
                        Contato
                    </h2>

                    
                </div>




                <form

                    class="contato"

                    action="https://api.web3forms.com/submit"

                    method="POST"


                >


                    
                    <input

                        type="hidden"

                        name="access_key"

                        value="745f84bd-ab41-4b55-8f3a-c49e217b43eb"

                    >



                

                    <input

                        type="hidden"

                        name="subject"

                        value="Novo contato - Sublima Arte"

                    >



                    <div class="campo">


                        <label for="nome">
                            Nome
                        </label>


                        <input

                            type="text"

                            id="nome"

                            name="name"

                            placeholder="Digite seu nome"

                            autocomplete="name"

                            required

                        >


                    </div>



                  
                    <div class="campo">


                        <label for="email">
                            E-mail
                        </label>


                        <input

                            type="email"

                            id="email"

                            name="email"

                            placeholder="Digite seu melhor e-mail"

                            autocomplete="email"

                            required

                        >


                    </div>




                    <div class="campo">


                        <label for="assunto">
                            Assunto
                        </label>


                        <input

                            type="text"

                            id="assunto"

                            name="assunto"

                            placeholder="Como podemos ajudar?"

                        >


                    </div>



                
                    <div class="campo">


                        <label for="mensagem">
                            Mensagem
                        </label>


                        <textarea

                            id="mensagem"

                            name="message"

                            placeholder="Escreva sua mensagem..."

                            required

                        ></textarea>


                    </div>



                    
                
                    <button class="btn"

                        type="submit"

                        class="botao"

                    >

                        ENVIAR MENSAGEM

                    </button>


                </form>


            </aside>


        </section>


    </main>
