    <section>
            <h1>Sublima Arte</h1>
            <p>Sua marca começa aqui.</p>
        </section>


    
        <section class="contato-container">


        
            <div class="localizacao">


                <div class="cabecalho-contato">

                
                    <h2>
                        Nossa localização
                    </h2>

                </div>


                <div class="mapa-container">

                    <iframe

                        class="mapa"

                        src="https://www.google.com/maps/place/O%C3%A1sis+Campos/@-21.7770613,-41.4778436,11z/data=!4m15!1m8!3m7!1s0x9963a3bf55e55b:0x4a9cbe1b7f6d8dc7!2sAv.+Brasil,+21669-23639+-+Guadalupe,+Rio+de+Janeiro+-+RJ,+21670-000!3b1!8m2!3d-22.8433773!4d-43.3741119!16s%2Fg%2F11c0rn6m9q!3m5!1s0xbdc561528de823:0xb8395dfb26b72108!8m2!3d-21.8355974!4d-41.4382783!16s%2Fg%2F11b6wp4281?entry=ttu&g_ep=EgoyMDI2MTExMC4wIKXMDSoASAFQAw%3D%3D"

                        title="Localização da Sublima Arte"

                        allowfullscreen

                        loading="lazy"

                        referrerpolicy="strict-origin-when-cross-origin">

                    </iframe>

                </div>


                

            </div>


            <aside class="sidebar">


                <div class="cabecalho-contato">

                
                    <h2>
                        Contato
                    </h2>

                    
                </div>




                <form

                    class="contato"

                    action="https://api.web3forms.com/submit"

                    method="POST"


                >


                    
                    <input

                        type="hidden"

                        name="access_key"

                        value="745f84bd-ab41-4b55-8f3a-c49e217b43eb"

                    >



                

                    <input

                        type="hidden"

                        name="subject"

                        value="Novo contato - Sublima Arte"

                    >



                    <div class="campo">


                        <label for="nome">
                            Nome
                        </label>


                        <input

                            type="text"

                            id="nome"

                            name="name"

                            placeholder="Digite seu nome"

                            autocomplete="name"

                            required

                        >


                    </div>



                  
                    <div class="campo">


                        <label for="email">
                            E-mail
                        </label>


                        <input

                            type="email"

                            id="email"

                            name="email"

                            placeholder="Digite seu melhor e-mail"

                            autocomplete="email"

                            required

                        >


                    </div>




                    <div class="campo">


                        <label for="assunto">
                            Assunto
                        </label>


                        <input

                            type="text"

                            id="assunto"

                            name="assunto"

                            placeholder="Como podemos ajudar?"

                        >


                    </div>



                
                    <div class="campo">


                        <label for="mensagem">
                            Mensagem
                        </label>


                        <textarea

                            id="mensagem"

                            name="message"

                            placeholder="Escreva sua mensagem..."

                            required

                        ></textarea>


                    </div>



                    
                
                    <button class="btn"

                        type="submit"

                        class="botao"

                    >

                        ENVIAR MENSAGEM

                    </button>


                </form>


            </aside>


        </section>
